    <path d="M392 344 H428" stroke="#7b847d" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M772 344 H808" stroke="#7b847d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="64" y="538" font-size="15" fill="#647367">DEMO PREVIEW · PLACEHOLDER</text>
    <text x="1136" y="538" text-anchor="end" font-size="15" fill="#647367">Request / review / prompt</text>
