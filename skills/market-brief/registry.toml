classification = "Industry classifications and cross-industry themes, kept separate"
disclosure_sources = ["https://www.cninfo.com.cn/", "https://www.pbc.gov.cn/", "https://www.stats.gov.cn/"]

[markets.us_equity]
aliases = ["us", "us stocks", "美股"]
