benchmarks = ["CSI 300", "SSE Composite", "SZSE Component", "ChiNext"]
timezone = "Asia/Shanghai"
currency = "CNY"
session_type = "exchange_calendar"
week_start = 0
cadences = ["premarket", "postmarket", "weekly", "monthly"]
