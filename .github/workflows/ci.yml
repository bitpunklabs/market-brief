name: Package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the skill, prompt routes, and documentation
        run: python scripts/check.py
      - name: Check packaging behavior and failure boundaries
        run: python -m unittest discover -s tests -v
      - name: Build and verify the installable package
        run: python scripts/package_release.py --output dist
      - name: Check the extracted package independently
        run: |
          python -m zipfile -e dist/market-brief-*.zip /tmp/market-brief-package
          python /tmp/market-brief-package/market-brief/scripts/check.py
          git diff --exit-code
